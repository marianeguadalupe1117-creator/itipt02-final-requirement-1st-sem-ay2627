
<ion-content [fullscreen]="true" class="recipes-content">

  <div class="recipes-container">
    <div class="recipe-banner">
      <h1>Ulam Recipes</h1>
    </div>
    <div class="recipes-body">
      <ion-searchbar
        placeholder="Search recipes"
        show-clear-button="focus"
        class="recipe-search">
      </ion-searchbar>

      <ion-list lines="none" class="recipe-list">
        <ion-item
          button
          detail="false"
          class="recipe-item"
          routerLink="/tab/instruction">
          <ion-label>
            <h2>Sinigang na Bangus</h2>
          </ion-label>
          <div slot="end" class="open-action">
            <span>Open</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </div>
        </ion-item>

        <ion-item
          button
          detail="false"
          class="recipe-item"
          routerLink="/tab/instruction">
          <ion-label>
            <h2>Adobong Pusit</h2>
          </ion-label>
          <div slot="end" class="open-action">
            <span>Open</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </div>
        </ion-item>
        <ion-item
          button
          detail="false"
          class="recipe-item"
          routerLink="/tab/instruction">
          <ion-label>
            <h2>Ginataang Gulay</h2>
          </ion-label>
          <div slot="end" class="open-action">
            <span>Open</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </div>
        </ion-item>
        <ion-item
          button
          detail="false"
          class="recipe-item"
          routerLink="/tab/instruction">
          <ion-label>
            <h2>Pinakbet</h2>
        </ion-label>

          <div slot="end" class="open-action">
            <span>Open</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </div>

        </ion-item>

        <ion-item
          button
          detail="false"
          class="recipe-item"
          routerLink="/tab/instruction">

          <ion-label>
            <h2>Tinola</h2>
          </ion-label>

          <div slot="end" class="open-action">
            <span>Open</span>
            <ion-icon name="arrow-forward-outline"></ion-icon>
         </div>

        </ion-item>
      </ion-list>
    </div>
  </div>

</ion-content>
